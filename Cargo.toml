[package]
name = "json_projection"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Strip unwanted members from JSON bytes before validation, using jiter's cursor"
repository = "https://github.com/rasmusfaber/json-projection"
rust-version = "1.88"

[lib]
name = "json_projection"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py39"] }
jiter = { version = "0.16", default-features = false }

[dev-dependencies]
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[features]
# enabled by maturin (see pyproject.toml); off for `cargo test` so the test binary can link libpython
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "fat"
codegen-units = 1
