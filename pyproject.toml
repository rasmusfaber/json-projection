[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "json-projection"
description = "Strip unwanted members from JSON bytes before validation; optional parse-time field exclusion for pydantic"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Rasmus Faber-Espensen" }]
keywords = ["json", "pydantic", "jiter", "performance", "projection"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
pydantic = ["pydantic>=2.13"]

[project.urls]
Repository = "https://github.com/rasmusfaber/json-projection"
Changelog = "https://github.com/rasmusfaber/json-projection/blob/main/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "json_projection._core"
features = ["extension-module"]

[dependency-groups]
dev = [
  "maturin>=1.7,<2",
  "pytest>=8",
  "pydantic>=2.13",
  "ruff>=0.6",
  "basedpyright>=1.20",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py39"
src = [".", "python"]
# gen_shapes.py is the prototype's dense generator, kept verbatim; formatting it buys nothing
extend-exclude = ["benchmarks/gen_shapes.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
include = ["python", "tests"]
pythonVersion = "3.9"
typeCheckingMode = "standard"

[tool.mypy]
# no python_version: mypy 2.x rejects 3.9 as a target; basedpyright's pythonVersion covers the 3.9 check
strict = true
files = ["python/json_projection"]
